[package]
name = "canon"
version = "0.1.0"
authors = ["pgattic <pgattic@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dioxus = { version = "0.6.0-rc.0", features = ["router"] }
libcanon = { git = "https://github.com/pgattic/libcanon.git" }
dioxus-logger = "0.5"
dirs = "5.0.1"

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
